name: Backend Quality

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/dayro-backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/dayro-backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dayro
          POSTGRES_USER: dayro
          POSTGRES_PASSWORD: dayro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dayro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon
        env:
          # application-loc.yml은 gitignore 대상이라 CI엔 존재하지 않음 - 여기서 직접 주입
          # docker-compose 자동 기동은 끄고 위 services 블록의 컨테이너를 직접 사용
          SPRING_DOCKER_COMPOSE_ENABLED: "false"
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dayro
          SPRING_DATASOURCE_USERNAME: dayro
          SPRING_DATASOURCE_PASSWORD: dayro
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          # 컨텍스트 로딩만 통과하면 되는 값 - 실제 외부 API를 호출하는 테스트는 없음
          SPRING_AI_OPENAI_API_KEY: ci-dummy-key
          SEOUL_OPEN_API_KEY: ci-dummy-key

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/dayro-backend/build/reports/tests/test
